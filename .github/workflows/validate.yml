name: Validate Filter Lists

on:
  push:
    paths:
      - 'Lists/**'
      - 'metadata.json'
  pull_request:
    paths:
      - 'Lists/**'
      - 'metadata.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate filter lists (check-only)
        shell: bash
        run: |
          set -euo pipefail
          ERRORS=0

          while IFS= read -r -d '' file; do
            echo "Checking $file"

            # --- Critical checks (cause failure) ---
            if LC_ALL=C grep -q $'\xEF\xBB\xBF' "$file" 2>/dev/null; then
              echo "ERROR: BOM detected -> $file"
              ERRORS=$((ERRORS+1))
            fi

            if LC_ALL=C grep -q $'\r' "$file" 2>/dev/null; then
              echo "ERROR: CRLF line endings detected -> $file"
              ERRORS=$((ERRORS+1))
            fi

            if LC_ALL=C grep -Pq '\x00' "$file" 2>/dev/null; then
              echo "ERROR: NULL byte found -> $file"
              ERRORS=$((ERRORS+1))
            fi

            if [ ! -s "$file" ]; then
              echo "ERROR: empty file -> $file"
              ERRORS=$((ERRORS+1))
              continue
            fi

            # Header checks
            if [ "$(grep -c '^! Title:' "$file" || true)" -ne 1 ]; then
              echo "WARNING: missing or multiple Title header -> $file"
            fi

            if [ "$(grep -c '^! Version:' "$file" || true)" -ne 1 ]; then
              echo "WARNING: missing or multiple Version header -> $file"
            fi

            if [ "$(grep -c '^! Last updated:' "$file" || true)" -ne 1 ]; then
              echo "WARNING: missing or multiple Last updated header -> $file"
            fi

            # Line-level generic sanity
            while IFS= read -r line || [ -n "$line" ]; do
              # skip empty and comment lines
              [[ -z "$line" || "$line" =~ ^! ]] && continue

              if [[ "$line" =~ [[:space:]]+$ ]]; then
                echo "WARNING: trailing whitespace -> $file"
              fi

              if [[ "$line" =~ denyallow ]]; then
                echo "WARNING: denyallow directive -> $file"
              fi

              if [[ "$line" =~ ^\|\|\* ]]; then
                echo "WARNING: overly broad wildcard -> $file"
              fi
            done < "$file"

            # Duplicate rules heuristic
            if awk '!/^!/ && NF {gsub(/[[:space:]]+$/,""); print}' "$file" | sort | uniq -d | grep -q .; then
              echo "WARNING: duplicate rules detected -> $file"
            fi

            # Format-specific basic sanity
            FORMAT_LINE=$(grep -m1 '^! Compatible:' "$file" || true)
            FORMAT=$(printf '%s' "$FORMAT_LINE" | sed -E 's/^! Compatible:[[:space:]]*//; s/[[:space:]]*$//' || true)
            FORMAT_LC=$(printf '%s' "$FORMAT" | tr '[:upper:]' '[:lower:]')

            if [[ -n "$FORMAT_LC" ]]; then
              case "$FORMAT_LC" in
                abp*|ublock*|brave*|adguard*)
                  # scan non-comment lines
                  while IFS= read -r line || [ -n "$line" ]; do
                    [[ -z "$line" || "$line" =~ ^! ]] && continue

                    # control/non-printable chars (exclude TAB and LF)
                    if printf '%s' "$line" | LC_ALL=C grep -Pq '[\x00-\x08\x0B\x0C\x0E-\x1F]' 2>/dev/null; then
                      echo "WARNING: control/non-printable characters in $file -> $line"
                    fi

                    # regex-delimited rules: must contain a non-escaped closing slash
                    if [[ "$line" =~ ^/ ]]; then
                      # remove escaped '\/' then count slashes; need at least two slashes to delimit /.../
                      if ! printf '%s' "$line" | sed 's/\\\//__ESC__/g' | awk -F'/' 'NF>=3 {exit 0} {exit 1}'; then
                        echo "WARNING: possible unterminated regex delimiter in $file -> $line"
                      fi
                    fi

                    # domain rules starting with || should have an alnum or xn-- start next
                    if [[ "$line" =~ ^\|\|([^/:\^*]+) ]]; then
                      dom="${BASH_REMATCH[1]}"
                      if [[ -z "$dom" || ! "$dom" =~ ^([A-Za-z0-9]|xn--|[[:alnum:]\-\.]) ]]; then
                        echo "WARNING: suspicious domain token after '||' in $file -> $line"
                      fi
                    elif [[ "$line" =~ ^\|\| ]]; then
                      echo "WARNING: malformed '||' rule -> $file -> $line"
                    fi

                    # explicit overly-generic wildcard '||*'
                    if [[ "$line" =~ ^\|\|\*$ ]]; then
                      echo "WARNING: overly broad wildcard '||*' exactly -> $file -> $line"
                    fi

                    # engine-specific directives that are risky
                    if printf '%s' "$line" | grep -qE '##\+js|##\+css|##\+abort' 2>/dev/null; then
                      echo "WARNING: engine-specific directive (##+js/##+css/##+abort) -> $file -> $line"
                    fi

                    # exception rules starting with @@ should have content after @@
                    if [[ "$line" =~ ^@@ ]]; then
                      if ! printf '%s' "$line" | grep -qE '^@@[^[:space:]]' 2>/dev/null; then
                        echo "WARNING: malformed exception rule -> $file -> $line"
                      fi
                    fi

                  done < "$file"
                  ;;
                *)
                  echo "WARNING: unknown format '$FORMAT' -> $file"
                  ;;
              esac
            fi

          done < <(find Lists -type f -name "*.txt" -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo "Validation failed with $ERRORS critical error(s)."
            exit 1
          fi

          echo "Validation completed (warnings may exist)."
