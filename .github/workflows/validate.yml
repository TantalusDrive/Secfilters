name: Validate Filter Lists

on:
  push:
    paths:
      - 'Lists/**'
      - 'metadata.json'
  pull_request:
    paths:
      - 'Lists/**'
      - 'metadata.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate filter lists (check-only)
        shell: bash
        run: |
          set -euo pipefail
          ERRORS=0
          WARNINGS=0

          # Build file list safely
          mapfile -d '' files < <(find Lists -type f -name "*.txt" -print0)

          for file in "${files[@]}"; do
            echo "Checking $file"

            # --- Critical checks ---
            if LC_ALL=C grep -q $'\xEF\xBB\xBF' "$file"; then
              echo "ERROR: BOM detected -> $file"
              ERRORS=$((ERRORS+1))
            fi
            if LC_ALL=C grep -q $'\r' "$file"; then
              echo "ERROR: CRLF line endings detected -> $file"
              ERRORS=$((ERRORS+1))
            fi

            if LC_ALL=C awk '{
                for(i=1;i<=length($0);i++){
                  if(substr($0,i,1)==0){found=1; exit}
                }
              } END {exit !found}' "$file"; then
              echo "ERROR: NULL byte found -> $file"
              ERRORS=$((ERRORS+1))
            fi

            if [ ! -s "$file" ]; then
              echo "ERROR: empty file -> $file"
              ERRORS=$((ERRORS+1))
              continue
            fi

            # Header checks
            for header in "Title" "Version" "Last updated"; do
              count=$(grep -c "^! ${header}:" "$file" || true)
              if [ "$count" -ne 1 ]; then
                echo "WARNING: missing or multiple ${header} header -> $file"
                WARNINGS=$((WARNINGS+1))
              fi
            done

            # Duplicate rules heuristic
            if awk '!/^!/ && NF {gsub(/[[:space:]]+$/,""); print}' "$file" | sort | uniq -c | awk '$1>1{exit 1}'; then
              echo "WARNING: duplicate rules detected -> $file"
              WARNINGS=$((WARNINGS+1))
            fi

            # Extract format
            FORMAT=$(grep -m1 '^! Compatible:' "$file" | sed -E 's/^! Compatible:[[:space:]]*//; s/[[:space:]]*$//' || true)
            FORMAT_LC=$(printf '%s' "$FORMAT" | tr '[:upper:]' '[:lower:]' | tr -s '[:space:]')

            case "$FORMAT_LC" in
              abp*|ublock*|brave*|adguard*|adblock\ plus*)
                while IFS= read -r line; do
                  [[ "$line" =~ ^! ]] && continue
                  [[ -z "$line" ]] && continue

                  # trailing whitespace
                  [[ "$line" =~ [[:space:]]$ ]] && { echo "WARNING: trailing whitespace -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }

                  # denyallow
                  [[ "$line" =~ denyallow ]] && { echo "WARNING: denyallow directive -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }

                  # overly broad wildcard
                  [[ "$line" == "||*" ]] && { echo "WARNING: overly broad wildcard '||*' -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }

                  # regex delimiter check
                  if [[ "$line" =~ ^/ ]]; then
                    cnt=0; esc=0
                    for ((i=0;i<${#line};i++)); do
                      c=${line:i:1}
                      if [[ "$c" == "\\" ]]; then esc=$((1-esc)); continue; fi
                      if [[ "$c" == "/" && $esc -eq 0 ]]; then cnt=$((cnt+1)); fi
                      esc=0
                    done
                    ((cnt<2)) && { echo "WARNING: possible unterminated regex delimiter -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }
                  fi

                  # domain heuristic
                  if [[ "$line" =~ ^\|\|([^/:^*]+) ]]; then
                    dom="${BASH_REMATCH[1]}"
                    [[ ! "$dom" =~ ^([A-Za-z0-9]|xn--) ]] && { echo "WARNING: suspicious domain token -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }
                  elif [[ "$line" =~ ^\|\| ]]; then
                    echo "WARNING: malformed '||' rule -> $file -> $line"; WARNINGS=$((WARNINGS+1))
                  fi

                  # engine-specific directives
                  [[ "$line" =~ ##\+js(\([a-zA-Z0-9_-]+\))?|##\+css|##\+abort ]] && { echo "WARNING: engine-specific directive -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }

                  # exception rules
                  [[ "$line" =~ ^@@ ]] && [[ ! "$line" =~ ^@@[^[:space:]] ]] && { echo "WARNING: malformed exception -> $file -> $line"; WARNINGS=$((WARNINGS+1)); }

                done < "$file"
                ;;
              *)
                [[ -n "$FORMAT_LC" ]] && { echo "WARNING: unknown format '$FORMAT' -> $file"; WARNINGS=$((WARNINGS+1)); }
                ;;
            esac
          done

          if ((ERRORS>0)); then
            echo "Validation failed with $ERRORS critical error(s)."
            exit 1
          fi
          echo "Validation completed (warnings: $WARNINGS)."
